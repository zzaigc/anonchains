; anonchains main configuration (proxychains-like INI style)
; Edit freely: changes are hot-reloaded. Invalid values are rejected and the
; previous valid configuration stays active.
; Environment overrides: ANONCHAINS_<SECTION>_<OPTION>=<value>

[chain]
; Number of hops. No upper limit; very large values increase latency and
; timeouts proportionally (see chain.effective_connect_timeout()).
hops = 5
; strict | dynamic | random | round_robin
mode = strict
; Automatic rotation period in seconds; 0 disables rotation.
rotation_seconds = 0
; Comma-separated protocol preference used when building chains.
prefer_protocols =
; Allow the same node to appear more than once in a chain.
allow_reuse = false

[pools]
candidate_dir = pools/candidate
verified_dir = pools/verified
batch_size = 500

[crawler]
concurrency = 32
timeout_seconds = 15.0
retries = 2
; Global request rate limit across all sources (token bucket).
rate_limit_per_second = 8.0
; Hard cap for one decompressed source response, in MiB. Oversized lists are
; truncated (with a warning) instead of consuming unbounded bandwidth/memory.
max_response_mb = 8.0
; Stealth level 1..4 (also selectable from the CLI menu).
stealth_level = 2
; Optional user-maintained extra source list (same schema as sources.yaml).
user_sources_file = config/sources.local.yaml
; Experimental repository-based source discovery.
discovery_enabled = false
; Honour robots.txt and per-source rate limits. Keep this true.
respect_robots = true

[validator]
concurrency = 64
timeout_seconds = 8.0
; Periodic re-check interval in seconds.
interval_seconds = 600
; Only nodes whose last check is older than this are re-validated.
ttl_seconds = 1800
max_consecutive_failures = 3
; Comma-separated echo endpoints used for exit-IP and anonymity checks.
echo_urls = https://api.ipify.org?format=json,https://httpbin.org/get
; unknown | transparent | anonymous | elite
min_anonymity = unknown
min_score = 0.0

[gateway]
; Master switch for the local API gateway AND the local proxy entry point.
enabled = false
; Loopback only. Changing this to a non-loopback address is rejected.
host = 127.0.0.1
; REST management port.
port = 8790
; Local SOCKS5/HTTP entry port exposing the active chain.
entry_port = 8791
token_required = true

[core]
; External cores carry protocols Python cannot implement natively.
enabled = true
; auto | sing-box | xray
prefer = auto
sing_box_path = sing-box
xray_path = xray
startup_timeout_seconds = 10.0

[vault]
enabled = true
path = pools/.vault
; auto | argon2id | scrypt  (auto falls back to scrypt without argon2-cffi)
kdf = auto
; Unlock lifetime; 0 keeps the key cached until manually locked.
key_ttl_seconds = 900
; aes-256-gcm | chacha20-poly1305
cipher = aes-256-gcm

[logging]
level = INFO
file = logs/anonchains.log
redact = true
sample_window_seconds = 5.0
